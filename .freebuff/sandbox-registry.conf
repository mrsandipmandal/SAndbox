# Sandbox Registry reverse proxy -> axum server on 127.0.0.1:3000
# Installed as /etc/apache2/conf-available/sandbox-registry.conf
# Server-level context: applies to every vhost on port 80 (incl. the default one),
# so http://localhost/registry works no matter which vhost handles the request.

ProxyPass        /registry/ http://127.0.0.1:3000/ nocanon retry=0
ProxyPassReverse /registry/ http://127.0.0.1:3000/
ProxyPass        /registry  http://127.0.0.1:3000/ nocanon retry=0
ProxyPassReverse /registry  http://127.0.0.1:3000/

<Location /registry>
    ProxyPreserveHost On
    Require all granted
</Location>
