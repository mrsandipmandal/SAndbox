name: 💡 Feature Request
description: Suggest a new feature for Sandbox
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea.

  - type: textarea
    id: problem
    attributes:
      label: 🎯 Problem
      description: What problem does this feature solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 Solution
      description: How should this feature work?
      placeholder: I would like Sandbox to...
    validations:
      required: true

  - type: textarea
    id: syntax
    attributes:
      label: 📝 Proposed Syntax
      description: If applicable, show what the syntax might look like
      placeholder: |
        fn example() -> Result<i64, string> {
            return Ok(42)
        }
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives
      description: Any alternative solutions or workarounds
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 📊 Priority
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 📎 Additional Context
      description: Any other context or screenshots
