name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Sandbox Language ────────────────────────────────────────────────────────
  check:
    name: Check & Test (Sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sandbox-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sandbox-${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          echo "Rust formatting check passed."

      - name: Clippy lints
        run: |
          set -euo pipefail
          # Emit a stable machine-readable summary even when Clippy passes,
          # so CI logs are easier to scan when a run regresses.
          cargo clippy --all-targets -- -D warnings
          echo "Clippy lint check passed."

      - name: Build
        run: |
          set -euo pipefail
          cargo build --verbose
          echo "Sandbox build passed."

      # Retry the heaviest Rust step a couple of times so transient CI flakes
      # (slow linker peaks, test runner races, temporary registry hiccups) don't
      # fail a PR on the first blip. Each attempt is independent, and the final
      # attempt still fails hard if the suite is genuinely broken.
      - name: Run tests (with retry)
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "===== cargo test attempt ${attempt}/${max_attempts} ====="
            if cargo test --verbose; then
              echo "Rust test suite passed on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Rust test suite failed on attempt ${attempt}; retrying in ~5s..."
              sleep 5
            fi
            attempt=$((attempt + 1))
          done

          echo "===== cargo test failed after ${max_attempts} attempts ====="
          echo "If this is a genuine test regression, fix it in code."
          echo "If this looks like a transient CI flake, re-run the job."
          exit 1

  # ── Binary smoke (fast end-to-end signal) ───────────────────────────────────
  # A small, cheap smoke test that exercises the compiled sandbox binary against
  # real source files across all three execution backends (C, LLVM, interpreter).
  # This is intentionally separate from the full test suite so a backend
  # regression can fail fast with the actual program output, not just inside
  # the Rust harness.
  smoke:
    name: Binary Smoke (C + LLVM + Interpreter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sandbox-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sandbox-${{ runner.os }}-cargo-

      - name: Verify clang (LLVM backend compiler)
        run: |
          set -euo pipefail
          clang --version
          echo "clang found: $(clang --version | head -n 1)"

      - name: Build sandbox binary
        run: |
          set -euo pipefail
          cargo build --verbose
          echo "Sandbox binary built."

      - name: Smoke test (hello world)
        env:
          SRC_HELLO: 'fn main() {\n    print("Hello, Sandbox!")\n}\n'
        run: |
          set -euo pipefail
          BIN="target/debug/sandbox"

          TMP="$(mktemp -d)"
          SOURCE="$TMP/hello.sbx"
          printf '%b' "$SRC_HELLO" > "$SOURCE"

          echo "----- hello.sbx -----"
          cat "$SOURCE"

          # Run once; --quiet suppresses compiler progress lines so stdout is
          # program output only.
          OUT="$($BIN run --quiet "$SOURCE")"
          echo "----- stdout -----"
          printf '%s\n' "$OUT"
          echo "----- end stdout -----"

          if ! printf '%s\n' "$OUT" | grep -qFx "Hello, Sandbox!"; then
            echo >&2 "FAIL: unexpected hello output"
            exit 1
          fi
          echo "Hello smoke test passed."

      - name: Smoke test (array literal)
        env:
          SRC_ARRAY: 'fn main() {\n    for item in [10, 20, 30] {\n        print(item)\n    }\n}\n'
        run: |
          set -euo pipefail
          BIN="target/debug/sandbox"

          TMP="$(mktemp -d)"
          SOURCE="$TMP/array.sbx"
          printf '%b' "$SRC_ARRAY" > "$SOURCE"

          echo "----- array.sbx -----"
          cat "$SOURCE"

          # Run once; --quiet makes stdout diffable against expected output.
          OUT="$($BIN run --quiet "$SOURCE")"
          echo "----- stdout -----"
          printf '%s\n' "$OUT"
          echo "----- end stdout -----"

          if ! printf '%s\n' "$OUT" | diff -u - <(printf '10\n20\n30\n'); then
            echo >&2 "FAIL: unexpected array output"
            exit 1
          fi
          echo "Array smoke test passed."

      - name: Smoke test (interpreter)
        env:
          SRC_ARRAY: 'fn main() {\n    for item in [10, 20, 30] {\n        print(item)\n    }\n}\n'
        run: |
          set -euo pipefail
          BIN="target/debug/sandbox"

          TMP="$(mktemp -d)"
          SOURCE="$TMP/array.sbx"
          printf '%b' "$SRC_ARRAY" > "$SOURCE"

          # The interpreter prints no banner; stdout is program output only.
          OUT="$($BIN interpret "$SOURCE")"
          echo "----- interpreter stdout -----"
          printf '%s\n' "$OUT"

          if ! printf '%s\n' "$OUT" | diff -u - <(printf '10\n20\n30\n'); then
            echo >&2 "FAIL: unexpected interpreter output"
            exit 1
          fi
          echo "Interpreter smoke test passed."

      - name: Smoke test (LLVM backend)
        env:
          SRC_ARRAY: 'fn main() {\n    for item in [10, 20, 30] {\n        print(item)\n    }\n}\n'
        run: |
          set -euo pipefail
          BIN="target/debug/sandbox"

          TMP="$(mktemp -d)"
          SOURCE="$TMP/array.sbx"
          printf '%b' "$SRC_ARRAY" > "$SOURCE"

          # Build a native binary via the LLVM backend (sandbox -> .ll -> clang).
          # clang's -Woverride-module warning goes to stderr; silence it.
          "$BIN" llvm-build "$SOURCE" -o "$TMP/llvm_prog" 2>/dev/null
          OUT="$($TMP/llvm_prog)"
          echo "----- llvm binary stdout -----"
          printf '%s\n' "$OUT"

          if ! printf '%s\n' "$OUT" | diff -u - <(printf '10\n20\n30\n'); then
            echo >&2 "FAIL: unexpected LLVM binary output"
            exit 1
          fi
          echo "LLVM backend smoke test passed."


  # ── Backend Parity ──────────────────────────────────────────────────────────
  parity:
    name: Backend Parity (C / LLVM / interpreter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sandbox-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sandbox-${{ runner.os }}-cargo-

      - name: Verify clang (LLVM backend compiler)
        run: |
          set -euo pipefail
          clang --version
          echo "clang found: $(clang --version | head -n 1)"

      # Fails on any backend output mismatch or backend regression beyond
      # the known-gap allowlist documented in tests/parity.rs.
      - name: Run backend parity harness (with retry)
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "===== parity test attempt ${attempt}/${max_attempts} ====="
            if cargo test --test parity -- --nocapture; then
              echo "Backend parity harness passed on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Backend parity harness failed on attempt ${attempt}; retrying in ~5s..."
              sleep 5
            fi
            attempt=$((attempt + 1))
          done

          echo "===== parity test failed after ${max_attempts} attempts ====="
          echo "If backends diverged, fix the regression first."
          echo "If this looks like a transient CI flake, re-run the job."
          exit 1

  # ── Registry Server ─────────────────────────────────────────────────────────
  registry:
    name: Check & Test (Registry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            registry/target
          key: registry-${{ runner.os }}-cargo-${{ hashFiles('registry/Cargo.lock') }}
          restore-keys: registry-${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          echo "Registry formatting check passed."

      - name: Clippy lints
        run: |
          set -euo pipefail
          cargo clippy --all-targets -- -D warnings
          echo "Registry Clippy check passed."

      - name: Build
        run: |
          set -euo pipefail
          cargo build --verbose
          echo "Registry build passed."

      - name: Run tests (with retry)
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "===== registry test attempt ${attempt}/${max_attempts} ====="
            if cargo test --verbose; then
              echo "Registry test suite passed on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Registry test suite failed on attempt ${attempt}; retrying in ~5s..."
              sleep 5
            fi
            attempt=$((attempt + 1))
          done

          echo "===== registry tests failed after ${max_attempts} attempts ====="
          echo "If this is a genuine test regression, fix it in code."
          echo "If this looks like a transient CI flake, re-run the job."
          exit 1

  # ── Docker Build ────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [check, parity, registry, smoke]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build registry Docker image
        uses: docker/build-push-action@v5
        with:
          context: registry
          push: false
          tags: sandbox-registry:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy (manual trigger) ─────────────────────────────────────────────────
  deploy:
    name: Deploy Registry
    runs-on: ubuntu-latest
    needs: [check, registry, docker, smoke]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify release artifact shape
        run: |
          set -euo pipefail
          echo "This workflow does not currently publish release artifacts,"
          echo "so this is a placeholder gate for future CD automation."

      - name: Required deploy steps (not implemented yet)
        run: |
          set -euo pipefail
          echo "This job is wired into CI, but the production deploy steps are not"
          echo "filled in yet. Before enabling automated deploys, add and verify:"
          echo ""
          echo "1. Registry image publishing"
          echo "   - Change docker/build-push-action push: false to push: true"
          echo "   - Set up registry credential secrets (example: REGISTRY_*)"
          echo "   - Decide on image tag strategy (sha, semver, latest-ish)"
          echo ""
          echo "2. Runtime deployment target"
          echo "   - Pick a host: VPS + Docker Compose, Fly.io, Railway, Cloud Run"
          echo "   - Add the corresponding deploy provider action or CLI step"
          echo "   - Store deploy secrets (host, tokens, image ref, env vars)"
          echo ""
          echo "3. Pre-deploy validation"
          echo "   - Health check / smoke test against the deployed registry"
          echo "   - Rollback plan if the new image fails to start"
          echo ""
          echo "4. Release artifact publishing (if this job should publish releases)"
          echo "   - Build cross-target release binaries"
          echo "   - Upload artifacts to the GitHub Release"
          echo "   - Attach checksums/signatures if required"
          echo ""
          echo "Once those are in place, remove or replace this placeholder step."
