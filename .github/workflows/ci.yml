name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Sandbox Language ────────────────────────────────────────────────────────
  check:
    name: Check & Test (Sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sandbox-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sandbox-${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # ── Registry Server ─────────────────────────────────────────────────────────
  registry:
    name: Check & Test (Registry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            registry/target
          key: registry-${{ runner.os }}-cargo-${{ hashFiles('registry/Cargo.lock') }}
          restore-keys: registry-${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # ── Docker Build ────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [check, registry]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build registry Docker image
        uses: docker/build-push-action@v5
        with:
          context: registry
          push: false
          tags: sandbox-registry:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy (manual trigger) ─────────────────────────────────────────────────
  deploy:
    name: Deploy Registry
    runs-on: ubuntu-latest
    needs: [check, registry, docker]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy instructions
        run: |
          echo "Registry deployment would go here."
          echo "Options:"
          echo "  - Docker Compose on a VPS"
          echo "  - Fly.io (fly deploy)"
          echo "  - Railway"
          echo "  - Cloud Run"
          echo ""
          echo "Configure your deployment target and add the steps here."
