[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"
description = "A memory-safe, financially-safe, general-purpose programming language"
license = "MIT"
repository = "https://github.com/sandbox-lang/sandbox"
homepage = "https://github.com/sandbox-lang/sandbox"
documentation = "https://github.com/sandbox-lang/sandbox#readme"
readme = "README.md"
keywords = ["language", "compiler", "finance", "money", "fintech"]
categories = ["compilers", "development-tools", "finance"]
authors = ["Sandbox Contributors"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
