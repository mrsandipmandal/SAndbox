services:
  registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandbox-registry
    ports:
      - "3000:3000"
    volumes:
      - registry-data:/app/registry-data
    environment:
      - REGISTRY_DB=/app/registry-data/registry.db
      - REGISTRY_ADDR=0.0.0.0:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  registry-data:
    driver: local
